
<ion-content [fullscreen]="true" class="login-content">

  <div class="login-container">

    <!-- Logo et présentation -->
    <div class="brand">
      <div class="brand-icon">
        <span class="logo-icon">🎬</span>
      </div>

      <h1>Movie<span>Match</span></h1>

      <p>
        Découvrez des films, partagez vos goûts
        et rencontrez des passionnés de cinéma.
      </p>
    </div>

    <!-- Formulaire de connexion -->
    <div class="login-card">

      <h2>Bon retour !</h2>
      <p class="subtitle">Connectez-vous à votre compte</p>

      <!-- E-mail -->
      <div class="input-group">
        <span class="field-icon">✉</span>

        <ion-input
          label="Adresse e-mail"
          labelPlacement="floating"
          type="email"
          [(ngModel)]="email">
        </ion-input>
      </div>

      <!-- Mot de passe -->
      <div class="input-group">
        <span class="field-icon">🔒</span>

        <ion-input
          label="Mot de passe"
          labelPlacement="floating"
          type="password"
          [(ngModel)]="password">
        </ion-input>
      </div>

      <!-- Bouton de connexion -->
      <ion-button
        expand="block"
        class="login-button"
        (click)="login()"
        [disabled]="busy">

        @if (busy) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Se connecter
        }

      </ion-button>

      <!-- Inscription -->
      <div class="register-section">
        <span>Vous n'avez pas de compte ?</span>

        <ion-button
          fill="clear"
          routerLink="/register"
          class="register-button">
          Créer un compte
        </ion-button>
      </div>

    </div>

    <!-- Pied de page -->
    <div class="footer">
      Votre prochain film préféré vous attend.
    </div>

  </div>

</ion-content>
